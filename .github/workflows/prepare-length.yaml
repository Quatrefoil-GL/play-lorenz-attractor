name: Protected Lorenz List length migration
on:
  push:
    branches: [prepare/lorenz-length-0301]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"
      - uses: actions/checkout@v7.0.1
        with:
          repository: calcit-lang/calcit
          ref: 0.30.1
          path: .calcit/core-test-tools
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/run-core-tests.mjs
            /scripts/core-test-protocol.mjs
            /scripts/core-tests-exclusions.cirru
            /docs/installation/wasm-support.md
      - name: Original dependencies
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          test "$(calcit -v)" = 0.30.1
          mkdir -p acceptance
      - name: Original gates and shared native/JS test before and after exact transaction
        run: |
          set -euo pipefail
          for phase in before after; do
            if [[ "$phase" == after ]]; then node prepare-length.mjs apply; fi
            original_blob="$(git hash-object calcit.cirru)"
            calcit edit format
            test "$(git hash-object calcit.cirru)" = "$original_blob"
            calcit --check-only --all-defs --format json > "acceptance/${phase}-all-defs.json"
            calcit fix --workflow strict --verify --format json > "acceptance/${phase}-strict.json"
            jq -e '.data.workflow.status == "passed" and .diagnostics == []' "acceptance/${phase}-strict.json"
            calcit js
            CALCIT_BIN="$(command -v calcit)"
            export CALCIT_BIN
            node .calcit/core-test-tools/scripts/run-core-tests.mjs \
              --snapshot calcit.cirru --entry default --backend native,js \
              --exclusions .calcit/core-test-tools/scripts/core-tests-exclusions.cirru \
              --support-matrix .calcit/core-test-tools/docs/installation/wasm-support.md \
              > "acceptance/${phase}-shared-tests.log"
            VITE_BASE_URL=./ yarn build
            find js-out -type f -print0 | sort -z | xargs -0 sha256sum > "acceptance/${phase}-js.sha256"
          done
          node prepare-length.mjs verify
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-source
          path: calcit.cirru
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostics
          path: acceptance/
          if-no-files-found: warn
          retention-days: 30
